name: Release ROM

# Se dispara al publicar un tag de versión (p. ej. v0.0.2-beta) o manualmente.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/versión a publicar (ej. v0.0.2-beta)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar ROM y publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MSXgl ANCLADO al commit del entorno de desarrollo (7f2b98b, 2026-05-24).
      # El HEAD de MSXgl produjo una ROM corrupta el 2026-08-05 (arranque con
      # basura en pantalla): la lib evoluciona sin compatibilidad garantizada,
      # asi que el CI compila contra el mismo commit con el que se verifica en
      # local. Para actualizar: probar el nuevo commit en local ANTES de cambiarlo.
      - name: Clonar MSXgl (anclado a 7f2b98b)
        run: |
          git init /tmp/MSXgl
          git -C /tmp/MSXgl remote add origin https://github.com/aoineko-fr/MSXgl.git
          git -C /tmp/MSXgl fetch --depth 1 origin 7f2b98b9179f3caecb4832117a3709d50a331a49
          git -C /tmp/MSXgl checkout FETCH_HEAD

      - name: Compilar msx_coco.rom
        run: |
          sed -i 's/\r$//' build.sh
          MSXGL=/tmp/MSXgl bash build.sh

      - name: Comprobar que el ROM existe
        run: test -f msx_coco.rom && ls -l msx_coco.rom

      - name: Crear / actualizar release con el ROM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: MSX COCO ${{ inputs.tag || github.ref_name }}
          body: |
            ROM de **MSX COCO** `${{ inputs.tag || github.ref_name }}` para **MSX2+** (chip V9958).

            Carga `msx_coco.rom` como cartucho en un emulador con V9958 (openMSX, blueMSX) o en hardware real.
            Controles: `ESPACIO` para empezar; cursores del teclado o joystick del puerto 1 para moverte.

            Ver el [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/docs/CHANGELOG.md) y el [README](https://github.com/${{ github.repository }}/blob/main/README.md).
          files: msx_coco.rom
          prerelease: ${{ contains(inputs.tag || github.ref_name, 'beta') || contains(inputs.tag || github.ref_name, 'alpha') || contains(inputs.tag || github.ref_name, 'rc') }}
          generate_release_notes: true
